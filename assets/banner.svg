<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frank Tei-Deku, Full Stack Developer, Accra, Ghana">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <rect x="0" y="0" width="1200" height="3" fill="#2563EB"/>

  <g font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" opacity="0.5" fill="#2563EB">
    <text x="1000" y="145" font-size="22" font-family="'Fira Code', 'Consolas', monospace">&gt;_</text>
  </g>

  <rect x="62" y="72" width="46" height="6" rx="3" fill="#2563EB"/>

  <text x="60" y="128" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" fill="#FAFAFA">Frank Tei-Deku</text>
  <text x="60" y="170" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" fill="#3B82F6">Full Stack Developer · Accra, Ghana</text>
  <text x="60" y="204" font-family="'Archivo', 'Segoe UI', system-ui, sans-serif" font-size="16" fill="#A1A1AA">Building production web products at INNOVISION GHANA</text>

  <rect x="60" y="228" width="230" height="1" fill="url(#accentSoft)" opacity="0.7"/>

  <g font-family="'Archivo', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#A1A1AA">
    <circle cx="66" cy="252" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="20" fill="freeze"/>
    </circle>
    <text x="80" y="257">Open to freelance &amp; contract work</text>
  </g>

  <path d="M0,270 C260,300 940,240 1200,270 L1200,300 L0,300 Z" fill="#050506" opacity="0.6"/>
</svg>
