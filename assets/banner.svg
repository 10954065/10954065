<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal window. Command: whoami. Output: Frank Tei-Deku, Full Stack Developer, Accra, Ghana. Command: cat mission.txt. Output: Building production web products at INNOVISION GHANA. Command: echo status. Output: available, open to freelance and contract work.">
  <defs>
